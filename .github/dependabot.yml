version: 2
updates:
  # Root Next.js app dependencies. Minor/patch updates are grouped to keep
  # PR volume low; major bumps still open individual PRs for review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    # The runtime is pinned to Node 24 (.nvmrc, engines, Functions runtime),
    # so type definitions must stay on the 24.x line. Node types majors have
    # repeatedly opened PRs that contradict that policy; minor/patch updates
    # within 24.x still flow through the group above.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Firebase Functions dependencies (separate package tree).
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions version updates (actions are pinned to commit SHAs in
  # workflows; Dependabot still proposes updated SHAs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
