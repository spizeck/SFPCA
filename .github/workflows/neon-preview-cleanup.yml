name: Neon preview cleanup

# Deletes the Neon `preview/<git-branch>` branches that the Vercel–Neon
# integration provisions for preview deployments but never removes
# (issue #262; lifecycle details in RUNBOOK §19a).
#
# Triggers:
#   pull_request_target [closed] — PR merged or closed. Runs on
#     pull_request_target so the workflow definition and the checked-out
#     code always come from the BASE branch: the Neon API key is a
#     secret, and no untrusted PR code ever runs next to it. The only
#     input taken from the event is pull_request.head.ref, passed via
#     env var (never shell-interpolated) and validated before use.
#   delete — covers git branches deleted without a PR-close path
#     (auto-delete-on-merge, direct pushes, manual cleanups).
#   schedule + workflow_dispatch — conservative sweep of preview/*
#     branches that have no matching open PR or remote branch, after a
#     grace period. Backstop for events missed or failed.
#
# Deletion is exact-name-match-then-delete-by-id, refuses the primary
# branch, and is a no-op when the branch is already gone. Without the
# NEON_API_KEY repo secret the script warns and exits 0.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  delete:
  schedule:
    - cron: "23 4 * * *" # daily 04:23 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete stale branches (default: dry-run)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read # sweep + shared-head-ref checks list open PRs

concurrency:
  group: neon-preview-cleanup
  cancel-in-progress: false # never abandon a delete mid-call

jobs:
  cleanup:
    name: Neon preview cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target: pin to the PR's BASE commit so the PR
          # cannot alter what runs beside the Neon secret. For delete /
          # schedule / dispatch events github.sha is already the
          # default branch.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete closed PR's preview branch
        if: github.event_name == 'pull_request_target'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/neon-preview-cleanup.ts

      - name: Delete deleted branch's preview branch
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR_HEAD_REF: ${{ github.event.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/neon-preview-cleanup.ts

      - name: Sweep stale preview branches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$SWEEP_APPLY" = "true" ]; then
            npx tsx scripts/neon-preview-cleanup.ts sweep --apply
          else
            npx tsx scripts/neon-preview-cleanup.ts sweep
          fi
