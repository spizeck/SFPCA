name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Change-aware CI. The `Detect changes` job classifies the PR diff into
# domains; each check below runs only when the diff can plausibly affect
# its domain. Pushes to main always run the full suite — main remains the
# integrated signal.
#
# Required-check safety: the "Protect main" ruleset requires
# "Next.js app", "Firebase Functions", "Firebase security rules" and
# "E2E smoke". Gating is done with job-level `if:` (never workflow-level
# `paths:` filters): a workflow filtered out entirely would leave its
# required checks pending forever, while a job skipped by a conditional
# reports Success and satisfies the ruleset. Check names therefore stay
# present and deterministic on every PR.
#
# The classifier fails safe: if the diff cannot be computed it reports
# "run everything" rather than skipping protection.
#
# All jobs resolve Node from .nvmrc (the repo's canonical runtime
# declaration). Root package.json "engines" declares the same policy for
# npm and Vercel; functions/package.json pins the Functions deploy
# runtime.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      functions: ${{ steps.classify.outputs.functions }}
      rules: ${{ steps.classify.outputs.rules }}
      db: ${{ steps.classify.outputs.db }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          app=false
          functions=false
          rules=false
          db=false
          e2e=false
          files=""

          run_all() {
            app=true; functions=true; rules=true; db=true; e2e=true
          }

          if [ "$EVENT_NAME" = "push" ]; then
            # Full integration run on main.
            run_all
          else
            files="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)" || files=""
            if [ -z "$files" ]; then
              # A real PR always has a diff; empty means the diff failed.
              # Fail safe toward full coverage, never toward skipping it.
              echo "::warning::Could not compute PR diff — running all domains"
              run_all
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue

              # Cheap validation for config-only changes that no longer
              # get exercised indirectly by a heavy suite.
              case "$f" in
                vercel.json|firebase.json|firestore.indexes.json|tsconfig.json)
                  node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || exit 1
                  ;;
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  if python3 -c "import yaml" 2>/dev/null; then
                    python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1
                  else
                    echo "::warning::PyYAML unavailable; skipping workflow YAML validation for $f"
                  fi
                  ;;
              esac

              case "$f" in
                # Docs / metadata / CI config: cannot affect runtime.
                *.md|LICENSE|docs/*|.github/*|.env.example|.gitignore|.gitattributes|.vercelignore|vercel.json|firestore-debug.log|test-results/*|playwright-report/*)
                  ;;

                # Postgres schema, migrations, DB tests and DB tooling.
                # src/lib/db and tests/db changes also affect the app
                # (`npm test` runs tests/db and app code imports the
                # schema) and real registry workflows (E2E).
                drizzle/*|drizzle.config.ts|src/lib/db/*|tests/db/*)
                  db=true; app=true; e2e=true ;;
                scripts/db-*|scripts/seed.ts|scripts/seed-data.json|scripts/migrate-firestore.ts|scripts/preview-migrate.ts|scripts/reconcile-migration.ts|scripts/neon-ops.ts)
                  db=true; app=true ;;
                scripts/deploy-functions.js|scripts/firebase-cli.mjs)
                  functions=true ;;

                # Firebase security rules, indexes and emulator config.
                # E2E runs against the same emulators, so rules changes
                # are E2E-relevant too.
                firestore.rules|storage.rules|firestore.indexes.json|firebase.json|.firebaserc|tests/*.test.mjs)
                  rules=true; e2e=true ;;

                # Emulator exec wrapper (#269): test:rules and the E2E
                # jobs run through it — changes must exercise both.
                scripts/emulators.ts|scripts/lib/emulator-ports.ts)
                  rules=true; e2e=true; app=true ;;

                # Firebase Functions package (isolated dependency tree;
                # not exercised by the E2E emulators).
                functions/*)
                  functions=true ;;

                # Playwright suite/config itself.
                tests/e2e/*|playwright*.config.ts)
                  e2e=true ;;

                # Unit/component tests (vitest include: tests/**/*.test.*).
                tests/*)
                  app=true ;;

                # Application runtime, including auth, proxy/middleware,
                # payments and admin flows — all E2E-relevant.
                src/*|public/*)
                  app=true; e2e=true ;;

                # Root dependencies / runtime pin: blast radius crosses
                # every domain that installs from the root lockfile
                # (app build/tests, drizzle-kit, firebase-tools,
                # Playwright) — broad coverage.
                package.json|package-lock.json|.nvmrc)
                  run_all ;;

                # Build/toolchain config that can change shipped output.
                next.config.ts|tsconfig.json|postcss.config.js)
                  app=true; e2e=true ;;

                # Lint/unit-test config: app job only.
                eslint.config.mjs|vitest.config.mts)
                  app=true ;;

                # Other scripts (ops tooling exercised indirectly) —
                # conservative: app coverage.
                scripts/*)
                  app=true ;;

                # Unknown top-level change: run everything.
                *)
                  run_all ;;
              esac
            done <<< "$files"
          fi

          echo "Changed files:"
          echo "$files"
          echo "Domains: app=$app functions=$functions rules=$rules db=$db e2e=$e2e"
          {
            echo "app=$app"
            echo "functions=$functions"
            echo "rules=$rules"
            echo "db=$db"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

  app:
    name: Next.js app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit/component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder public Firebase config. The client SDK requires
          # non-empty NEXT_PUBLIC_* values to initialize during static
          # generation; Firestore reads fail closed to null fallbacks.
          # These are not secrets and no real credentials are used.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  functions:
    name: Firebase Functions
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate functions exports
        run: node -e "const f = require('./index.js'); for (const name of ['onFirestoreChange', 'triggerRebuild']) { if (!f[name]) { console.error('Missing required function export', name); process.exit(1); } }"

  # Security-rules tests are neither app nor Functions code and need the
  # Java-based emulator suite, so they get their own check.
  rules:
    name: Firebase security rules
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run security rules tests
        run: npm run test:rules

  # Postgres registry foundation (#165): proves the checked-in drizzle/
  # migrations replay cleanly from an empty database and that
  # src/lib/db/schema.ts and the generated SQL have not drifted. PGlite
  # provides real Postgres semantics in-process — no service container,
  # no credentials, no production dependency.
  database:
    name: Postgres schema
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations match the schema
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/

      - name: Migration replay + registry tests (PGlite)
        run: npm run test:db

  # Browser smoke tests need a browser install plus the Java-based
  # Firebase emulators, so they run in their own job rather than
  # extending the app build. The Playwright config uses emulator-only
  # demo-* config; no production Firebase or credentials are involved.
  e2e:
    name: E2E smoke
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Run maintenance-mode E2E
        run: npm run test:e2e:maintenance

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
